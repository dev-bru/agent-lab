[project]
name = "agent-lab"
version = "0.1.0"
description = "Learn how an AI agent works, by hand and with LangGraph, on a local model."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp==4.1.4",
    "litellm==1.106.6",
    "langgraph==1.2.18",
    "langchain-litellm==0.11.2",
    "pydantic==2.14.2",
    "tzdata==2026.6",
]

[project.scripts]
agent-lab = "agent_lab.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "playwright==1.64.1",
    "pytest-xdist==3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_lab"]

[tool.pytest.ini_options]
addopts = "-m 'not live' -n auto"
markers = ["live: needs llama-server running (opt-in: pytest -m live)"]
testpaths = ["tests"]
pythonpath = ["src"]
